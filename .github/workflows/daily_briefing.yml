name: 섹터 ETF 이평선 브리핑 (매일 장마감 후)

on:
  schedule:
    # 미국 장마감 후 한국시간 오전 6:30 실행
    # 미국 동부시간 기준 오후 4:00 = UTC 21:00 = KST 다음날 오전 6:00
    # 여유분 30분 추가 → UTC 21:30 (KST 오전 6:30)
    # 미국 증시 개장일: 월~금 → 한국시간 화~토요일에 실행
    - cron: '30 21 * * 1-5'   # UTC 월~금 21:30 (KST 화~토 06:30)
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  sector-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install yfinance>=0.2.50 pandas>=2.0.0 requests python-dotenv

      - name: 섹터 이평선 브리핑 실행
        run: python sector_briefing.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
