name: Keepalive Workflow (60일 자동 비활성화 방지)

on:
  schedule:
    # 매월 1일과 15일 00:00 UTC에 실행 (GitHub Actions 비활성화 방지)
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  cronjob-based-github-action:
    name: Keepalive
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: GitHub Actions 자동 수명 연장
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore: keepalive to prevent workflow suspension [skip ci]"
